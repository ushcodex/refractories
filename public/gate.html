<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07070c">
  <title>Welcome — u19ce</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/yearbook.css">
</head>
<body>
  <main class="gate-page">
    <section class="gate-card">
      <div class="gate-mark">🔥</div>
      <p class="yb-eyebrow">Class of 2024</p>
      <h1 class="gate-title">One question before you come in.</h1>
      <p class="gate-question" id="gate-question">Loading the question...</p>

      <form class="gate-form" id="gate-form">
        <div class="yb-field">
          <label for="gate-answer">Your answer <span class="required">*</span></label>
          <input id="gate-answer" name="answer" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block" id="gate-submit" disabled>Enter</button>
      </form>

      <p class="error" id="gate-error" role="alert" style="margin-top:10px;"></p>

      <p class="gate-footnote">
        This is a private class space. The answer is something we all know.
      </p>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const next = params.get('next') || '/';
    const questionEl = document.getElementById('gate-question');
    const form = document.getElementById('gate-form');
    const answerInput = document.getElementById('gate-answer');
    const errorEl = document.getElementById('gate-error');
    const submitBtn = document.getElementById('gate-submit');

    function renderQuestion() {
      fetch('/api/gate', { headers: { accept: 'application/json' } })
        .then(r => r.json())
        .then(data => {
          if (data.authorized) {
            location.replace(next.startsWith('/') && !next.startsWith('//') ? next : '/');
            return;
          }
          questionEl.textContent = data.question || 'Who are we?';
          submitBtn.disabled = false;
        })
        .catch(() => {
          questionEl.textContent = 'Who are we?';
          errorEl.textContent = 'Could not load the question. Refresh and try again.';
        });
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.textContent = '';
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/gate', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            answer: answerInput.value,
            next,
          }),
        });
        const data = await response.json();
        if (!response.ok) {
          errorEl.textContent = data.error || 'Not quite. Try again.';
          submitBtn.disabled = false;
          return;
        }
        location.replace(data.next || '/');
      } catch {
        errorEl.textContent = 'Could not check your answer. Try again.';
        submitBtn.disabled = false;
      }
    });

    renderQuestion();
  </script>
</body>
</html>
