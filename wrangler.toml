name = "u19ce"
pages_build_output_dir = "public"
compatibility_date = "2024-09-25"

# Production D1: yearbook database.  Preview uses refractories-yearbook-preview.
[[d1_databases]]
binding = "DB"
database_name = "refractories-yearbook"
database_id = "9101055a-1e64-450a-bb53-e56d87b9799c"

# Production R2: reuse existing refractories-photos bucket; yearbook images stored under yearbook/ prefix.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "refractories-photos"

